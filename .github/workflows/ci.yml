name: Rag1
on: push
jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Welcome Message and List Directories
        run: |
          echo "Hey World, Welcome"
          ls -ltra

      - name: Install Cowsay
        run: sudo apt install cowsay -y

      - name: Generate ASCII Artwork
        run: cowsay -f dragon "Rawr! Run, I am a dragon!" >> dragon.txt

      - name: Sleep for 30 seconds
        run: sleep 30

  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:

        - name: Sleep for 10 seconds
          run: sleep 10

        - name: Test Dragon File Exists
          run: grep -i "dragon" dragon.txt

  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    steps:
       - name: Read File
         run: cat dragon.txt

