name: Rag1
on: push
jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Welcome Message
        run: |
          echo "Hey World, Welcome"

      - name: Install Cowsay
        run: sudo apt install cowsay -y

      - name: Generate ASCII Artwork
        run: cowsay -f dragon "Rawr! Run, I am a dragon!" >> dragon.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          #name: default is 'artifact'
          name: dragon-text-file
          path: dragon.txt
          # archive: false

  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - name: Download Dragon File
        uses: actions/download-artifact@v8
        with:
          name: dragon-text-file

      - name: Test Dragon File Exists
        run: grep -i "dragon" dragon.txt

  deploy_job:
    needs: [test_job]
    runs-on: ubuntu-latest
    steps:
      - name: Download Dragon File
        uses: actions/download-artifact@v8
        with:
          name: dragon-text-file

      - name: Read File
        run: cat dragon.txt
