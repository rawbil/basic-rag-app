name: Rag1
on: push
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Welcome Message and List Directories
        run: |
          echo "Hey World, Welcome"
          ls -ltra

      - name: Install Cowsay
        run: sudo apt install cowsay -y

      - name: Generate ASCII Artwork
        run: cowsay -f dragon "Rawr! Run, I am a dragon!" >> dragon.txt

      - name: Test Dragon File Exists
        run: grep -i "dragon" dragon.txt

      - name: Read File
        run: cat dragon.txt

      # - name: List Directories
      #   run: ls
